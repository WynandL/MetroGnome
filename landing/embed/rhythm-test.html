<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Timing Test - Metro Gnome</title>
  <!-- Widget build of https://metrognome.co.za/tools/rhythm-timing-test.html. Generated by landing/embed/build-embeds.sh -
       do not edit by hand, edit the tool page and re-run the script.
       noindex keeps a thin duplicate out of the index; follow keeps the
       attribution links below flowing equity back to the full tool. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://metrognome.co.za/tools/rhythm-timing-test.html">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="stylesheet" href="/blog/style.css">
  <link rel="stylesheet" href="/embed/style.css">
</head>
<body class="embed-body">

    <section class="tool-panel" aria-label="Interactive rhythm and timing test">
      <div class="metro-wrap">
        <img id="metroImg" src="/metro.png" alt="Metro the gnome, bobs on every beat">
      </div>

      <div class="bpm-readout" id="mainReadout">--</div>
      <div class="bpm-unit" id="mainUnit">groove score</div>
      <div class="marking" id="statusLabel">Ready when you are</div>

      <div class="beat-dots" id="beatDots" aria-hidden="true"></div>

      <button class="tap-pad" id="tapPad" type="button">START TEST</button>

      <div class="stat-row" id="statRow" hidden>
        <div class="stat">
          <span class="stat-value" id="jitterValue">--</span>
          <span class="stat-label">Spread (consistency)</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="biasValue">--</span>
          <span class="stat-label">Average offset</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="hitsValue">--</span>
          <span class="stat-label">Beats counted</span>
        </div>
      </div>

      <p class="verdict" id="verdict" hidden></p>

      <div class="tool-controls">
        <button class="btn-ghost" id="retryBtn" type="button" hidden>Try again</button>
      </div>

      <p class="tool-hint">Use <kbd>Space</kbd> or tap the button. Headphones give a cleaner result than speakers. Four count-in beats come first, then sixteen scored beats at 100 BPM.</p>
      <p class="embed-credit">
        <a href="https://metrognome.co.za/tools/rhythm-timing-test.html?ref=embed" target="_blank" rel="noopener">Rhythm timing test</a>
        by <a href="https://metrognome.co.za/?ref=embed" target="_blank" rel="noopener">Metro Gnome</a>
      </p>
    </section>

  <script>
  (function () {
    var tapPad     = document.getElementById('tapPad');
    var retryBtn   = document.getElementById('retryBtn');
    var mainReadout= document.getElementById('mainReadout');
    var mainUnit   = document.getElementById('mainUnit');
    var statusLabel= document.getElementById('statusLabel');
    var beatDots   = document.getElementById('beatDots');
    var statRow    = document.getElementById('statRow');
    var jitterValue= document.getElementById('jitterValue');
    var biasValue  = document.getElementById('biasValue');
    var hitsValue  = document.getElementById('hitsValue');
    var verdict    = document.getElementById('verdict');
    var metroImg   = document.getElementById('metroImg');
    var bandRows   = Array.prototype.slice.call(document.querySelectorAll('#bandTableBody tr'));

    /* Same tuning constants the app grades a session with:
       spread <= TIGHT earns full credit, >= LOOSE earns none. */
    var TIGHT_MS   = 25;
    var LOOSE_MS   = 110;
    var BIAS_GRACE = 60;
    var MIN_HITS   = 5;

    var BPM        = 100;
    var COUNT_IN   = 4;
    var SCORED     = 16;
    var interval   = 60 / BPM;              // seconds per beat

    var audioCtx = null;
    var state = 'idle';                     // idle | running | done
    var beatPerfTimes = [];                 // scored beats, in performance.now() ms
    var taps = [];
    var schedulerTimer = null;
    var nextBeatTime = 0;
    var beatIndex = 0;                      // beats scheduled so far
    var ctxToPerf = 0;                      // performance.now() ms for audioCtx time 0

    var LOOKAHEAD_MS = 25;
    var SCHEDULE_AHEAD_S = 0.12;

    /* ── dots ─────────────────────────────────────────────────────────── */
    function buildDots() {
      beatDots.innerHTML = '';
      for (var i = 0; i < SCORED; i++) {
        var d = document.createElement('span');
        d.className = 'beat-dot';
        beatDots.appendChild(d);
      }
    }
    function markDot(i, cls) {
      var d = beatDots.children[i];
      if (d) d.className = 'beat-dot ' + cls;
    }
    buildDots();

    /* ── audio clock <-> performance clock ────────────────────────────── */
    function syncClocks() {
      var perfNow = performance.now();
      var ctxNow  = audioCtx.currentTime;
      if (typeof audioCtx.getOutputTimestamp === 'function') {
        var ts = audioCtx.getOutputTimestamp();
        if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
          ctxToPerf = ts.performanceTime - ts.contextTime * 1000;
          return;
        }
      }
      /* Fallback: assume the reported output latency, else no correction. */
      var lat = (typeof audioCtx.outputLatency === 'number' && isFinite(audioCtx.outputLatency))
        ? audioCtx.outputLatency : 0;
      ctxToPerf = perfNow - ctxNow * 1000 + lat * 1000;
    }
    function ctxTimeToPerf(t) { return t * 1000 + ctxToPerf; }

    /* ── click voice: 1100 Hz like the app, 1800 Hz on the downbeat ───── */
    function playClick(time, accent) {
      var osc  = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = accent ? 1800 : 1100;
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.4 : 0.32, time + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.05);

      var delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
      setTimeout(bump, delayMs);
    }

    function bump() {
      metroImg.classList.remove('bump');
      void metroImg.offsetWidth;
      metroImg.classList.add('bump');
      setTimeout(function () { metroImg.classList.remove('bump'); }, 90);
    }

    /* ── scheduler ────────────────────────────────────────────────────── */
    function scheduler() {
      while (nextBeatTime < audioCtx.currentTime + SCHEDULE_AHEAD_S) {
        var total = COUNT_IN + SCORED;
        if (beatIndex >= total) {
          /* let the final beat's window close before scoring */
          var endsIn = Math.max(0, (nextBeatTime - audioCtx.currentTime) * 1000);
          clearInterval(schedulerTimer);
          schedulerTimer = null;
          setTimeout(finish, endsIn + interval * 500 + 120);
          return;
        }
        var isCountIn = beatIndex < COUNT_IN;
        playClick(nextBeatTime, beatIndex % 4 === 0);
        if (!isCountIn) beatPerfTimes.push(ctxTimeToPerf(nextBeatTime));

        if (isCountIn) {
          var n = COUNT_IN - beatIndex;
          (function (label, t) {
            setTimeout(function () {
              if (state === 'running') statusLabel.textContent = label > 0 ? String(label) : '';
            }, Math.max(0, (t - audioCtx.currentTime) * 1000));
          })(n, nextBeatTime);
        } else if (beatIndex === COUNT_IN) {
          (function (t) {
            setTimeout(function () {
              if (state === 'running') statusLabel.textContent = 'Tap every beat';
            }, Math.max(0, (t - audioCtx.currentTime) * 1000));
          })(nextBeatTime);
        }

        beatIndex++;
        nextBeatTime += interval;
      }
    }

    /* ── run control ──────────────────────────────────────────────────── */
    function start() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      state = 'running';
      taps = [];
      beatPerfTimes = [];
      beatIndex = 0;
      buildDots();
      statRow.hidden = true;
      verdict.hidden = true;
      retryBtn.hidden = true;
      bandRows.forEach(function (r) { r.classList.remove('current-row'); });
      mainReadout.textContent = '--';
      mainUnit.textContent = 'groove score';
      tapPad.textContent = 'TAP';
      tapPad.classList.add('is-live');
      statusLabel.textContent = 'Listen...';

      syncClocks();
      nextBeatTime = audioCtx.currentTime + 0.35;
      schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
      scheduler();

      /* getOutputTimestamp can read as zero on a context that has only just
         started. Re-sync during the count-in, well before the first scored
         beat is scheduled, so the beat times the score is built from use the
         real output clock rather than the fallback estimate. */
      setTimeout(function () { if (state === 'running') syncClocks(); }, 400);
      setTimeout(function () { if (state === 'running') syncClocks(); }, 1200);
    }

    function registerTap() {
      if (state !== 'running') return;
      var t = performance.now();
      taps.push(t);
      bump();

      /* live dot feedback for the nearest beat, if it is close enough */
      var best = -1, bestAbs = Infinity;
      for (var i = 0; i < beatPerfTimes.length; i++) {
        var d = Math.abs(t - beatPerfTimes[i]);
        if (d < bestAbs) { bestAbs = d; best = i; }
      }
      if (best >= 0 && bestAbs <= interval * 500) {
        markDot(best, bestAbs <= 50 ? 'hit-great' : 'hit-ok');
      }
    }

    /* ── scoring ──────────────────────────────────────────────────────── */
    function median(xs) {
      var s = xs.slice().sort(function (a, b) { return a - b; });
      var m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    /* Robust spread: scaled median absolute deviation, so one stray tap
       cannot dominate the result the way a plain standard deviation would. */
    function robustSpread(xs) {
      if (xs.length < 2) return 0;
      var med = median(xs);
      var mad = median(xs.map(function (x) { return Math.abs(x - med); }));
      return 1.4826 * mad;
    }

    function finish() {
      state = 'done';
      tapPad.classList.remove('is-live');
      tapPad.textContent = 'START TEST';
      retryBtn.hidden = false;

      /* Fold every tap onto its nearest beat; anything further than half a
         beat away cannot be attributed to a beat and is dropped. */
      var devs = [];
      var used = {};
      for (var i = 0; i < taps.length; i++) {
        var best = -1, bestAbs = Infinity, bestDev = 0;
        for (var j = 0; j < beatPerfTimes.length; j++) {
          var dev = taps[i] - beatPerfTimes[j];
          if (Math.abs(dev) < bestAbs) { bestAbs = Math.abs(dev); best = j; bestDev = dev; }
        }
        if (best >= 0 && bestAbs <= interval * 500 && !used[best]) {
          used[best] = true;
          devs.push(bestDev);
        }
      }

      if (devs.length < MIN_HITS) {
        mainReadout.textContent = '--';
        mainUnit.textContent = 'not enough taps';
        statusLabel.textContent = 'Give it another go';
        statRow.hidden = true;          /* never leave the previous run's stats on screen */
        verdict.hidden = false;
        verdict.textContent = 'Only ' + devs.length + ' tap' + (devs.length === 1 ? '' : 's') +
          ' landed close enough to a beat to be counted. The test needs at least ' + MIN_HITS +
          '. Start it again and tap on every single beat, including the ones that feel obvious.';
        return;
      }

      var spread = robustSpread(devs);
      var bias   = devs.reduce(function (a, b) { return a + b; }, 0) / devs.length;
      var frac   = Math.min(1, Math.max(0, (LOOSE_MS - spread) / (LOOSE_MS - TIGHT_MS)));
      var score  = Math.round(frac * 100);

      mainReadout.textContent = score;
      mainUnit.textContent = 'groove score';
      statusLabel.textContent = bandName(score);
      statRow.hidden = false;
      jitterValue.textContent = Math.round(spread) + ' ms';
      biasValue.textContent = (bias >= 0 ? '+' : '') + Math.round(bias) + ' ms';
      hitsValue.textContent = devs.length + '/' + SCORED;

      bandRows.forEach(function (r) {
        var lo = Number(r.getAttribute('data-min'));
        var hi = Number(r.getAttribute('data-max'));
        r.classList.toggle('current-row', score >= lo && score <= hi);
      });

      verdict.hidden = false;
      verdict.textContent = readOut(score, spread, bias, devs.length);
    }

    function bandName(score) {
      if (score >= 85) return 'Tight';
      if (score >= 65) return 'Solid';
      if (score >= 40) return 'Developing';
      return 'Loose';
    }

    function readOut(score, spread, bias, counted) {
      var s = '';
      if (score >= 85) {
        s = 'Tight. Your taps sat within about ' + Math.round(spread) + ' ms of each other, which is the range where timing stops being the thing holding a take back.';
      } else if (score >= 65) {
        s = 'Solid. A spread of about ' + Math.round(spread) + ' ms is a good, usable pulse. Closing it further is mostly a matter of subdividing at slower tempos.';
      } else if (score >= 40) {
        s = 'Developing. Your pulse is there, but it moved by about ' + Math.round(spread) + ' ms across the test. That is almost always a subdivision gap rather than a talent one.';
      } else {
        s = 'Loose, on this attempt. A spread of about ' + Math.round(spread) + ' ms is audible to a listener, and it is also the band that improves fastest with deliberate practice.';
      }
      if (Math.abs(bias) > BIAS_GRACE) {
        s += ' You also sat ' + Math.round(Math.abs(bias)) + ' ms ' + (bias < 0 ? 'ahead of' : 'behind') +
             ' the click on average, though on a browser some of that offset is your device rather than you.';
      }
      if (counted < SCORED * 0.6) {
        s += ' Note that only ' + counted + ' of ' + SCORED + ' beats were counted, so this reads more like a sample than a full result. Tap every beat for a score you can trust.';
      }
      return s;
    }

    /* ── input ────────────────────────────────────────────────────────── */
    tapPad.addEventListener('click', function () {
      if (state === 'running') registerTap(); else start();
    });
    retryBtn.addEventListener('click', start);

    window.addEventListener('keydown', function (e) {
      if (e.code !== 'Space' || e.repeat) return;
      e.preventDefault();
      tapPad.classList.add('pressed');
      if (state === 'running') registerTap(); else start();
    });
    window.addEventListener('keyup', function (e) {
      if (e.code === 'Space') tapPad.classList.remove('pressed');
    });
  })();
  </script>

</body>
</html>
