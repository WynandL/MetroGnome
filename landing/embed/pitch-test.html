<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Test - Metro Gnome</title>
  <!-- Widget build of https://metrognome.co.za/tools/pitch-ear-test.html. Generated by landing/embed/build-embeds.sh -
       do not edit by hand, edit the tool page and re-run the script.
       noindex keeps a thin duplicate out of the index; follow keeps the
       attribution links below flowing equity back to the full tool. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://metrognome.co.za/tools/pitch-ear-test.html">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="stylesheet" href="/blog/style.css">
  <link rel="stylesheet" href="/embed/style.css">
</head>
<body class="embed-body">

    <section class="tool-panel" aria-label="Interactive pitch discrimination test">
      <div class="metro-wrap">
        <img id="metroImg" src="/metro.png" alt="Metro the gnome, bobs on every note">
      </div>

      <div class="bpm-readout" id="mainReadout">--</div>
      <div class="bpm-unit" id="mainUnit">cents apart</div>
      <div class="marking" id="statusLabel">Ready when you are</div>
      <div class="best-line" id="bestLine" aria-live="polite"></div>

      <div class="pitch-progress" id="progress" aria-hidden="true"></div>
      <div class="pp-count" id="roundLabel" aria-live="polite"></div>

      <button class="tap-pad" id="startPad" type="button">START TEST</button>

      <div class="answer-row" id="answerRow" hidden>
        <button class="tap-pad answer-pad" id="lowerBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12"/></svg>
          LOWER
        </button>
        <button class="tap-pad answer-pad" id="higherBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          HIGHER
        </button>
      </div>

      <div class="stat-row" id="statRow" hidden>
        <div class="stat">
          <span class="stat-value" id="semiValue">--</span>
          <span class="stat-label">Of a semitone</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="rightValue">--</span>
          <span class="stat-label">Answers right</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="roundsValue">--</span>
          <span class="stat-label">Finest you got right</span>
        </div>
      </div>

      <figure class="tap-strip" id="stairStrip" hidden>
        <svg id="stairSvg" viewBox="0 0 320 140" role="img" aria-label="The gap between the two notes on every round, and where your result settled"></svg>
        <figcaption>Each dot is one round: gold when you got it right, hollow when you did not. The gap shrinks after right answers and widens after a miss, and settles around the smallest difference you can hear. The dashed line is your result.</figcaption>
      </figure>

      <p class="verdict" id="verdict" hidden></p>

      <div class="tool-controls">
        <button class="btn-ghost" id="replayBtn" type="button" hidden>Hear them again</button>
        <button class="btn-ghost" id="retryBtn" type="button" hidden>Try again</button>
      </div>

      <p class="tool-hint">Headphones in a quiet room work best. Use the buttons, or <kbd>&uarr;</kbd> for higher and <kbd>&darr;</kbd> for lower. Not sure? Make your best guess: the test is built to expect some misses.</p>
      <p class="embed-credit">
        <a href="https://metrognome.co.za/tools/pitch-ear-test.html?ref=embed" target="_blank" rel="noopener">Pitch test</a>
        by <a href="https://metrognome.co.za/?ref=embed" target="_blank" rel="noopener">Metro Gnome</a>
      </p>
    </section>

  <script>
  (function () {
    var startPad    = document.getElementById('startPad');
    var answerRow   = document.getElementById('answerRow');
    var lowerBtn    = document.getElementById('lowerBtn');
    var higherBtn   = document.getElementById('higherBtn');
    var replayBtn   = document.getElementById('replayBtn');
    var retryBtn    = document.getElementById('retryBtn');
    var mainReadout = document.getElementById('mainReadout');
    var mainUnit    = document.getElementById('mainUnit');
    var statusLabel = document.getElementById('statusLabel');
    var bestLine    = document.getElementById('bestLine');
    var progress    = document.getElementById('progress');
    var roundLabel  = document.getElementById('roundLabel');
    var statRow     = document.getElementById('statRow');
    var semiValue   = document.getElementById('semiValue');
    var rightValue  = document.getElementById('rightValue');
    var roundsValue = document.getElementById('roundsValue');
    var stairStrip  = document.getElementById('stairStrip');
    var stairSvg    = document.getElementById('stairSvg');
    var verdict     = document.getElementById('verdict');
    var metroImg    = document.getElementById('metroImg');
    var bandRows    = Array.prototype.slice.call(document.querySelectorAll('#bandTableBody tr'));

    /* Adaptive staircase, 2-down 1-up: two right answers in a row narrow
       the gap, one miss widens it, so the gap settles where the listener
       is right about 71% of the time. Steps are multiplicative because
       pitch hearing works in ratios, not hertz. */
    var START_CENTS   = 100;                /* a full semitone: an easy, confident start */
    var MIN_CENTS     = 0.5;
    var MAX_CENTS     = 200;
    var BIG_STEP      = 2;                  /* until the first reversal */
    var SMALL_STEP    = Math.SQRT2;
    var ROUNDS        = 24;                 /* fixed length, so progress is honest; under ~20 a lucky streak skews too many results */
    var SKIP_REVERSALS = 2;                 /* the first turning points are still on the way down */

    var NOTE_S        = 0.45;
    var GAP_S         = 0.35;
    var ROVE_LOW_HZ   = 330;                /* the pair's centre moves every round (E4 ...) */
    var ROVE_HIGH_HZ  = 523;                /* (... C5) so the first note cannot be ignored */

    var audioCtx = null;
    var state = 'idle';                     /* idle | listening | answering | done */
    var cents, consecutive, lastDir, reversals, reversalCents, history, rightCount;
    var trial = null;                       /* { centre, up } for the round in play */
    var answerTimer = null;

    /* ── progress: one segment per round, gold when right ─────────────── */
    function buildProgress() {
      progress.innerHTML = '';
      for (var i = 0; i < ROUNDS; i++) {
        var d = document.createElement('span');
        d.className = 'pp-seg';
        progress.appendChild(d);
      }
    }
    function markProgress() {
      for (var i = 0; i < progress.children.length; i++) {
        var c = 'pp-seg';
        if (i < history.length) c += history[i].right ? ' right' : ' miss';
        else if (i === history.length && state !== 'done') c += ' current';
        progress.children[i].className = c;
      }
    }
    buildProgress();

    /* ── best result, in this browser only (lower is better) ─────────── */
    var BEST_KEY = 'metrognome.pitchTest.best';
    function readBest() {
      try {
        var v = Number(window.localStorage.getItem(BEST_KEY));
        return v > 0 ? v : null;
      } catch (e) { return null; }
    }
    function saveBest(v) {
      try { window.localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
    }
    function showBest(isNew) {
      var best = readBest();
      bestLine.classList.toggle('is-new', isNew);
      if (isNew) bestLine.textContent = 'New best';
      else if (best !== null) bestLine.textContent = 'Your best: ' + fmtCents(best) + ' cents';
      else bestLine.textContent = '';
    }

    function fmtCents(c) { return c < 10 ? c.toFixed(1) : String(Math.round(c)); }

    /* ── tone: a soft harmonic note, close to a plucked or bowed string
       rather than a bare sine, so it sounds like music and every partial
       carries the pitch. ────────────────────────────────────────────── */
    var PARTIALS = [1, 0.5, 0.33, 0.22, 0.14, 0.09];
    function playNote(freq, when) {
      var out = audioCtx.createGain();
      out.gain.setValueAtTime(0, when);
      out.gain.linearRampToValueAtTime(0.22, when + 0.02);
      out.gain.setValueAtTime(0.22, when + NOTE_S - 0.08);
      out.gain.linearRampToValueAtTime(0, when + NOTE_S);
      out.connect(audioCtx.destination);
      for (var i = 0; i < PARTIALS.length; i++) {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq * (i + 1);
        g.gain.value = PARTIALS[i];
        osc.connect(g).connect(out);
        osc.start(when);
        osc.stop(when + NOTE_S + 0.02);
      }
      setTimeout(bump, Math.max(0, (when - audioCtx.currentTime) * 1000));
    }

    function bump() {
      metroImg.classList.remove('bump');
      void metroImg.offsetWidth;
      metroImg.classList.add('bump');
      setTimeout(function () { metroImg.classList.remove('bump'); }, 90);
    }

    /* The pair sits symmetrically around a roving centre, so neither note
       is ever the same "home" pitch two rounds running. */
    function playPair() {
      var t0 = audioCtx.currentTime + 0.12;
      var half = Math.pow(2, cents / 2400);
      var first  = trial.up ? trial.centre / half : trial.centre * half;
      var second = trial.up ? trial.centre * half : trial.centre / half;
      playNote(first, t0);
      playNote(second, t0 + NOTE_S + GAP_S);
      return (0.12 + NOTE_S * 2 + GAP_S) * 1000;
    }

    function setAnswering(on) {
      lowerBtn.disabled = !on;
      higherBtn.disabled = !on;
      replayBtn.disabled = !on;
    }

    function nextRound() {
      if (state === 'done') return;
      trial = {
        centre: ROVE_LOW_HZ * Math.pow(ROVE_HIGH_HZ / ROVE_LOW_HZ, Math.random()),
        up: Math.random() < 0.5
      };
      state = 'listening';
      setAnswering(false);
      mainReadout.textContent = fmtCents(cents);
      statusLabel.textContent = 'Listen...';
      roundLabel.textContent = 'Round ' + (history.length + 1) + ' of ' + ROUNDS;
      markProgress();
      var ms = playPair();
      clearTimeout(answerTimer);
      answerTimer = setTimeout(function () {
        if (state !== 'listening') return;
        state = 'answering';
        setAnswering(true);
        statusLabel.textContent = 'Was the second note higher or lower?';
      }, ms);
    }

    /* ── run control ──────────────────────────────────────────────────── */
    function start() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.MetroAds) window.MetroAds.busy(true);

      cents = START_CENTS;
      consecutive = 0;
      lastDir = 0;
      reversals = 0;
      reversalCents = [];
      history = [];
      rightCount = 0;

      startPad.hidden = true;
      answerRow.hidden = false;
      replayBtn.hidden = false;
      retryBtn.hidden = true;
      statRow.hidden = true;
      stairStrip.hidden = true;
      verdict.hidden = true;
      bandRows.forEach(function (r) { r.classList.remove('current-row'); });
      mainUnit.textContent = 'cents apart';
      showBest(false);
      nextRound();
    }

    function answer(saidUp) {
      if (state !== 'answering') return;
      var right = saidUp === trial.up;
      history.push({ cents: cents, right: right });
      if (right) rightCount++;

      metroImg.classList.toggle('glow', right);
      setTimeout(function () { metroImg.classList.remove('glow'); }, 300);

      /* 2-down 1-up with reversal tracking */
      var dir = 0;
      if (right) {
        consecutive++;
        if (consecutive >= 2) { dir = -1; consecutive = 0; }
      } else {
        consecutive = 0;
        dir = 1;
      }
      if (dir !== 0) {
        if (lastDir !== 0 && dir !== lastDir) {
          reversals++;
          reversalCents.push(cents);
        }
        lastDir = dir;
        var step = reversals === 0 ? BIG_STEP : SMALL_STEP;
        cents = dir < 0 ? cents / step : cents * step;
        cents = Math.min(MAX_CENTS, Math.max(MIN_CENTS, cents));
      }

      markProgress();
      if (history.length >= ROUNDS) {
        finish();
        return;
      }
      state = 'listening';
      setAnswering(false);
      statusLabel.textContent = right ? 'Nice' : 'Close one';
      setTimeout(nextRound, 300);
    }

    function finish() {
      state = 'done';
      clearTimeout(answerTimer);
      if (window.MetroAds) window.MetroAds.busy(false);
      answerRow.hidden = true;
      replayBtn.hidden = true;
      startPad.hidden = false;
      restKey(startPad);
      retryBtn.hidden = true;

      /* the geometric mean of the turning points once the gap has come down
         to the listener's level; too few of them, and the recent gaps stand in */
      var pool = reversalCents.slice(SKIP_REVERSALS);
      if (pool.length < 4) pool = history.slice(-10).map(function (h) { return h.cents; });
      var logSum = pool.reduce(function (a, c) { return a + Math.log(c); }, 0);
      var result = Math.exp(logSum / pool.length);
      result = Math.round(result * 10) / 10;

      mainReadout.textContent = fmtCents(result);
      mainUnit.textContent = 'cents, your finest gap';
      statusLabel.textContent = bandName(result);
      statRow.hidden = false;
      semiValue.textContent = fractionOfSemitone(result);
      rightValue.textContent = rightCount + '/' + history.length;
      var finest = Infinity;
      history.forEach(function (h) { if (h.right && h.cents < finest) finest = h.cents; });
      roundsValue.textContent = isFinite(finest) ? fmtCents(finest) + '¢' : '--';
      roundLabel.textContent = '';
      markProgress();

      bandRows.forEach(function (r) {
        var lo = Number(r.getAttribute('data-min'));
        var hi = Number(r.getAttribute('data-max'));
        r.classList.toggle('current-row', result >= lo && result < hi);
      });

      var prevBest = readBest();
      if (prevBest === null || result < prevBest) saveBest(result);
      showBest(prevBest !== null && result < prevBest);

      drawStairs(result);
      verdict.hidden = false;
      verdict.textContent = readOut(result);
      reveal(result, cents, fmtCents);
    }

    function fractionOfSemitone(c) {
      if (c >= 100) return 'Over 1';
      var n = Math.round(100 / c);
      return '1/' + n;
    }

    function bandName(c) {
      if (c < 5) return 'Finely tuned';
      if (c < 12) return 'Sharp';
      if (c < 25) return 'Musical';
      return 'Warming up';
    }

    function readOut(c) {
      var f = fmtCents(c);
      if (c < 5) return 'Finely tuned. You heard differences of about ' + f + ' cents, roughly ' + fractionOfSemitone(c) + ' of a semitone. That is the territory of highly trained listeners.';
      if (c < 12) return 'Sharp. About ' + f + ' cents is a fine ear: small enough to hear a string drifting out before a tuner tells you.';
      if (c < 25) return 'Musical. About ' + f + ' cents is a solid working ear for tuning and playing with others. Short daily runs will narrow it further.';
      return 'Warming up. About ' + f + ' cents is a very common first result, and this is the range that improves fastest. Try headphones in a quiet room, then run it again.';
    }

    /* ── staircase chart: the gap on every round, log scale ──────────── */
    var SVG_NS = 'http://www.w3.org/2000/svg';
    function el(name, attrs, text) {
      var n = document.createElementNS(SVG_NS, name);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text) n.textContent = text;
      return n;
    }
    function drawStairs(result) {
      var W = 320, LEFT = 40, RIGHT = 12, TOP = 10, BOTTOM = 124;
      var LOG_HI = Math.log(MAX_CENTS), LOG_LO = Math.log(1);
      function y(c) {
        var l = Math.log(Math.max(1, Math.min(MAX_CENTS, c)));
        return TOP + (LOG_HI - l) / (LOG_HI - LOG_LO) * (BOTTOM - TOP);
      }
      var n = Math.max(history.length, 2);
      function x(i) { return LEFT + (W - LEFT - RIGHT) * (i + 0.5) / n; }

      while (stairSvg.firstChild) stairSvg.removeChild(stairSvg.firstChild);
      [100, 10, 1].forEach(function (c) {
        stairSvg.appendChild(el('line', { 'class': 'ts-grid', x1: LEFT - 4, x2: W - RIGHT, y1: y(c), y2: y(c) }));
        stairSvg.appendChild(el('text', { 'class': 'ts-label', x: 2, y: y(c) + 4 }, c + '¢'));
      });
      stairSvg.appendChild(el('line', { 'class': 'ts-centre ts-result', x1: LEFT - 4, x2: W - RIGHT, y1: y(result), y2: y(result) }));

      var pts = history.map(function (h, i) { return x(i).toFixed(1) + ',' + y(h.cents).toFixed(1); });
      if (pts.length > 1) stairSvg.appendChild(el('polyline', { 'class': 'ts-path', points: pts.join(' ') }));
      history.forEach(function (h, i) {
        var dot = el('circle', { 'class': h.right ? 'ts-tap tight' : 'ts-miss', cx: x(i), cy: y(h.cents), r: h.right ? 3.6 : 3.2 });
        if (h.right) dot.style.animationDelay = (i * 20) + 'ms';
        dot.appendChild(el('title', {}, 'Round ' + (i + 1) + ': ' + fmtCents(h.cents) + ' cents, ' + (h.right ? 'right' : 'missed')));
        stairSvg.appendChild(dot);
      });
      stairStrip.hidden = false;
    }


    /* ── finish moment, the same in every test: the start key rests as
       DONE for a moment so a last tap cannot start a run on top of the
       result, then the score counts into place, Metro cheers, and the
       page brings the score into view if it has scrolled away. ──────── */
    var REST_MS = 1600;
    var restUntil = 0;
    function restKey(pad) {
      restUntil = performance.now() + REST_MS;
      pad.classList.remove('is-live');
      pad.classList.add('is-done');
      pad.disabled = true;
      pad.textContent = 'DONE';
      setTimeout(function () {
        pad.classList.remove('is-done');
        pad.disabled = false;
        pad.textContent = 'START AGAIN';
      }, REST_MS);
    }
    function reveal(to, from, fmt) {
      var raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window)
                                             : function (f) { setTimeout(f, 16); };
      mainReadout.classList.remove('reveal');
      metroImg.classList.remove('cheer');
      void mainReadout.offsetWidth;
      mainReadout.classList.add('reveal');
      metroImg.classList.add('cheer');
      var t0 = performance.now(), DUR = 750;
      (function step() {
        var k = Math.min(1, (performance.now() - t0) / DUR);
        var e = 1 - Math.pow(1 - k, 3);
        mainReadout.textContent = fmt(from + (to - from) * e);
        if (k < 1) raf(step);
      })();
      if (mainReadout.getBoundingClientRect && window.scrollBy) {
        var top = mainReadout.getBoundingClientRect().top;
        if (top < 60 || top > window.innerHeight * 0.45) {
          window.scrollBy({ top: top - 140, behavior: 'smooth' });
        }
      }
    }
    /* ── input ────────────────────────────────────────────────────────── */
    startPad.addEventListener('click', start);
    retryBtn.addEventListener('click', start);
    lowerBtn.addEventListener('click', function () { answer(false); });
    higherBtn.addEventListener('click', function () { answer(true); });
    replayBtn.addEventListener('click', function () {
      if (state !== 'answering') return;
      state = 'listening';
      setAnswering(false);
      var ms = playPair();
      clearTimeout(answerTimer);
      answerTimer = setTimeout(function () {
        if (state !== 'listening') return;
        state = 'answering';
        setAnswering(true);
      }, ms);
    });

    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      if (e.key === 'ArrowUp')   { e.preventDefault(); answer(true); }
      if (e.key === 'ArrowDown') { e.preventDefault(); answer(false); }
    });

    showBest(false);
  })();
  </script>

</body>
</html>
