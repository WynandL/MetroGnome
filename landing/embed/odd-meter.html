<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odd Meter Metronome - Metro Gnome</title>
  <!-- Widget build of https://metrognome.co.za/tools/odd-meter-practice-tool.html. Generated by landing/embed/build-embeds.sh -
       do not edit by hand, edit the tool page and re-run the script.
       noindex keeps a thin duplicate out of the index; follow keeps the
       attribution links below flowing equity back to the full tool. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://metrognome.co.za/tools/odd-meter-practice-tool.html">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="stylesheet" href="/blog/style.css">
  <link rel="stylesheet" href="/embed/style.css">
</head>
<body class="embed-body">

    <section class="tool-panel" aria-label="Interactive odd meter practice tool">
      <div class="metro-wrap">
        <img id="metroImg" src="/metro.png" alt="Metro the gnome, bobs on every accented pulse">
      </div>

      <div class="bpm-readout" id="meterReadout">7/8</div>
      <div class="bpm-unit">time signature</div>
      <div class="marking" id="meterLabel">Odd &middot; Felt in 2+2+3</div>

      <div class="group-viz" id="groupViz" aria-hidden="true"></div>

      <div class="meter-controls">
        <div class="stepper-group">
          <span class="stepper-label">Beats</span>
          <div class="stepper">
            <button class="stepper-btn" id="topMinus" type="button" aria-label="Fewer beats">&minus;</button>
            <span class="stepper-value" id="topValue">7</span>
            <button class="stepper-btn" id="topPlus" type="button" aria-label="More beats">+</button>
          </div>
        </div>
        <div class="stepper-group">
          <span class="stepper-label">Note value</span>
          <div class="denom-picker" id="denomPicker">
            <button class="denom-btn" type="button" data-denom="2">2</button>
            <button class="denom-btn" type="button" data-denom="4">4</button>
            <button class="denom-btn active" type="button" data-denom="8">8</button>
            <button class="denom-btn" type="button" data-denom="16">16</button>
          </div>
        </div>
      </div>

      <div class="preset-row" id="presetRow">
        <button class="preset-chip" type="button" data-top="4" data-bottom="4">4/4</button>
        <button class="preset-chip" type="button" data-top="3" data-bottom="4">3/4</button>
        <button class="preset-chip" type="button" data-top="6" data-bottom="8">6/8</button>
        <button class="preset-chip" type="button" data-top="5" data-bottom="4">5/4</button>
        <button class="preset-chip active" type="button" data-top="7" data-bottom="8">7/8</button>
        <button class="preset-chip" type="button" data-top="9" data-bottom="8">9/8</button>
        <button class="preset-chip" type="button" data-top="11" data-bottom="8">11/8</button>
      </div>

      <button class="tap-pad" id="playBtn" type="button">&#9654; PLAY</button>

      <div class="bpm-control">
        <button class="stepper-btn" id="bpmMinus" type="button" aria-label="Slower">&minus;</button>
        <span class="bpm-control-value" id="bpmValue">80</span>
        <span class="bpm-control-unit">BPM</span>
        <button class="stepper-btn" id="bpmPlus" type="button" aria-label="Faster">+</button>
      </div>

      <p class="tool-hint">Change the time signature or tempo any time, even while it is playing. Turn your sound on. Each numbered pulse is the count within its group; the gold ones are the accents.</p>
      <p class="embed-credit">
        <a href="https://metrognome.co.za/tools/odd-meter-practice-tool.html?ref=embed" target="_blank" rel="noopener">Odd meter metronome</a>
        by <a href="https://metrognome.co.za/?ref=embed" target="_blank" rel="noopener">Metro Gnome</a>
      </p>
    </section>

  <script>
  (function () {
    var metroImg = document.getElementById('metroImg');
    var meterReadout = document.getElementById('meterReadout');
    var meterLabel = document.getElementById('meterLabel');
    var groupViz = document.getElementById('groupViz');
    var topValue = document.getElementById('topValue');
    var topMinus = document.getElementById('topMinus');
    var topPlus = document.getElementById('topPlus');
    var denomPicker = document.getElementById('denomPicker');
    var denomBtns = Array.prototype.slice.call(denomPicker.querySelectorAll('.denom-btn'));
    var presetRow = document.getElementById('presetRow');
    var presetBtns = Array.prototype.slice.call(presetRow.querySelectorAll('.preset-chip'));
    var playBtn = document.getElementById('playBtn');
    var bpmValue = document.getElementById('bpmValue');
    var bpmMinus = document.getElementById('bpmMinus');
    var bpmPlus = document.getElementById('bpmPlus');
    var referenceRows = Array.prototype.slice.call(document.querySelectorAll('#referenceTable tbody tr'));

    var TOP_MIN = 1, TOP_MAX = 16;
    var BPM_MIN = 40, BPM_MAX = 160;

    var top = 7, bottom = 8, bpm = 80;
    var isPlaying = false;

    /* ── Meter.kt, ported: classification, grouping, and labels ────────
       Mirrors app/src/main/java/.../theory/Meter.kt exactly, so this page
       can never disagree with what the app itself does with the same
       time signature. */
    function classify(t) {
      if (t <= 1) return 'SIMPLE';
      if (t >= 2 && t <= 4) return 'SIMPLE';
      if (t % 3 === 0) return 'COMPOUND';
      return 'IRREGULAR';
    }

    function irregularGroups(n) {
      if (n <= 0) return [1];
      var groups = [];
      var remaining = n;
      while (remaining >= 2) { groups.push(2); remaining -= 2; }
      if (remaining === 1) {
        if (groups.length) groups[groups.length - 1] = 3;
        else groups.push(1);
      }
      return groups;
    }

    function beatGrouping(t) {
      var cls = classify(t);
      if (cls === 'SIMPLE') return [Math.max(t, 1)];
      if (cls === 'COMPOUND') {
        var n = t / 3, arr = [];
        for (var i = 0; i < n; i++) arr.push(3);
        return arr;
      }
      return irregularGroups(t);
    }

    function countWord(n) {
      return { 2: 'duple', 3: 'triple', 4: 'quadruple', 5: 'quintuple', 6: 'sextuple' }[n] || null;
    }

    function label(t) {
      var cls = classify(t);
      if (cls === 'SIMPLE') { var w = countWord(t); return 'Simple' + (w ? ' ' + w : ''); }
      if (cls === 'COMPOUND') { var w2 = countWord(t / 3); return 'Compound' + (w2 ? ' ' + w2 : ''); }
      return (t % 2 === 1) ? 'Odd' : 'Irregular';
    }

    function description(t) {
      var cls = classify(t);
      if (cls === 'SIMPLE') return 'Felt in ' + Math.max(t, 1) + ', beats split in two';
      if (cls === 'COMPOUND') return 'Felt in ' + (t / 3) + ', beats split in three';
      return 'Felt in ' + beatGrouping(t).join('+');
    }

    /* ── visualisation ───────────────────────────────────────────────── */
    var pulseEls = []; // flat, index = pulse position in the bar

    function rebuildViz() {
      groupViz.innerHTML = '';
      pulseEls = [];
      var groups = beatGrouping(top);
      groups.forEach(function (size) {
        var box = document.createElement('div');
        box.className = 'group-box';
        for (var i = 0; i < size; i++) {
          var el = document.createElement('span');
          el.className = 'group-pulse' + (i === 0 ? ' accent' : '');
          el.textContent = String(i + 1);
          box.appendChild(el);
          pulseEls.push(el);
        }
        groupViz.appendChild(box);
      });
    }

    function updateReadout() {
      meterReadout.textContent = top + '/' + bottom;
      meterLabel.textContent = label(top) + ' · ' + description(top);
      topValue.textContent = String(top);
      bpmValue.textContent = String(bpm);
      denomBtns.forEach(function (b) { b.classList.toggle('active', Number(b.getAttribute('data-denom')) === bottom); });
      presetBtns.forEach(function (b) {
        b.classList.toggle('active', Number(b.getAttribute('data-top')) === top && Number(b.getAttribute('data-bottom')) === bottom);
      });
      referenceRows.forEach(function (r) {
        r.classList.toggle('current-row', Number(r.getAttribute('data-top')) === top && Number(r.getAttribute('data-bottom')) === bottom);
      });
      rebuildViz();
    }

    function setTop(t) {
      top = Math.max(TOP_MIN, Math.min(TOP_MAX, t));
      updateReadout();
      if (isPlaying) restart();
    }
    function setBottom(b) {
      bottom = b;
      updateReadout();
      if (isPlaying) restart();
    }
    function setBpm(b) {
      bpm = Math.max(BPM_MIN, Math.min(BPM_MAX, b));
      updateReadout();
      if (isPlaying) restart();
    }

    topMinus.addEventListener('click', function () { setTop(top - 1); });
    topPlus.addEventListener('click', function () { setTop(top + 1); });
    bpmMinus.addEventListener('click', function () { setBpm(bpm - 4); });
    bpmPlus.addEventListener('click', function () { setBpm(bpm + 4); });

    denomBtns.forEach(function (b) {
      b.addEventListener('click', function () { setBottom(Number(b.getAttribute('data-denom'))); });
    });
    presetBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        top = Number(b.getAttribute('data-top'));
        bottom = Number(b.getAttribute('data-bottom'));
        updateReadout();
        if (isPlaying) restart();
      });
    });

    /* ── audio: lookahead scheduler on the Web Audio clock, same
       discipline as the tap-tempo and rhythm-test tools, so playback
       never drifts even though the poll interval itself is imprecise. */
    var audioCtx = null;
    var schedulerTimer = null;
    var nextPulseTime = 0;
    var barPulseIndex = 0; // 0-based position within the current bar
    var LOOKAHEAD_MS = 25;
    var SCHEDULE_AHEAD_S = 0.12;

    function isAccentPulse(idx) {
      var groups = beatGrouping(top);
      var acc = 0, i = 0;
      for (var g = 0; g < groups.length; g++) {
        if (i === idx) return true;
        i += groups[g];
      }
      return false;
    }

    function playPulse(time, accent) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = accent ? 1800 : 1100;
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.4 : 0.32, time + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.05);

      var pulseIdx = barPulseIndex;
      var delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
      setTimeout(function () { flashPulse(pulseIdx); bump(); }, delayMs);
    }

    function flashPulse(idx) {
      pulseEls.forEach(function (el) { el.classList.remove('playing'); });
      var el = pulseEls[idx];
      if (el) el.classList.add('playing');
    }

    function bump() {
      metroImg.classList.remove('bump');
      void metroImg.offsetWidth;
      metroImg.classList.add('bump');
      setTimeout(function () { metroImg.classList.remove('bump'); }, 90);
    }

    function scheduler() {
      var secondsPerPulse = 60 / bpm;
      var barLength = top;
      while (nextPulseTime < audioCtx.currentTime + SCHEDULE_AHEAD_S) {
        playPulse(nextPulseTime, isAccentPulse(barPulseIndex));
        nextPulseTime += secondsPerPulse;
        barPulseIndex = (barPulseIndex + 1) % barLength;
      }
    }

    function start() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      barPulseIndex = 0;
      nextPulseTime = audioCtx.currentTime + 0.08;
      schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
      scheduler();
      isPlaying = true;
      playBtn.innerHTML = '&#9632; STOP';
      playBtn.classList.add('is-live');
    }

    function stop() {
      if (schedulerTimer) clearInterval(schedulerTimer);
      schedulerTimer = null;
      isPlaying = false;
      playBtn.innerHTML = '&#9654; PLAY';
      playBtn.classList.remove('is-live');
      pulseEls.forEach(function (el) { el.classList.remove('playing'); });
    }

    function restart() { stop(); start(); }

    playBtn.addEventListener('click', function () { isPlaying ? stop() : start(); });

    updateReadout();
  })();
  </script>

</body>
</html>
