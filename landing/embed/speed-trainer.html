<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Trainer - Metro Gnome</title>
  <!-- Widget build of https://metrognome.co.za/tools/speed-trainer.html. Generated by landing/embed/build-embeds.sh -
       do not edit by hand, edit the tool page and re-run the script.
       noindex keeps a thin duplicate out of the index; follow keeps the
       attribution links below flowing equity back to the full tool. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://metrognome.co.za/tools/speed-trainer.html">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="stylesheet" href="/blog/style.css">
  <link rel="stylesheet" href="/embed/style.css">
</head>
<body class="embed-body">

    <section class="tool-panel" aria-label="Interactive speed trainer metronome">
      <div class="metro-wrap">
        <img id="metroImg" src="/metro.png" alt="Metro the gnome, bobs on every beat">
      </div>

      <div class="bpm-readout" id="bpmReadout">60</div>
      <div class="bpm-unit">BPM</div>
      <div class="marking" id="statusLabel">Ready when you are</div>

      <div class="beat-dots" id="beatDots" aria-hidden="true"></div>
      <div class="st-progress" aria-hidden="true"><span id="progressBar"></span></div>
      <div class="st-ladder" id="ladder" aria-label="Every tempo in this session"></div>

      <div class="st-settings" id="settings">
        <div class="stepper-group">
          <span class="stepper-label">Start BPM</span>
          <div class="stepper">
            <button class="stepper-btn" type="button" data-set="start" data-d="-1" aria-label="Lower start tempo">&minus;</button>
            <span class="stepper-value" id="startValue">60</span>
            <button class="stepper-btn" type="button" data-set="start" data-d="1" aria-label="Raise start tempo">+</button>
          </div>
        </div>
        <div class="stepper-group">
          <span class="stepper-label">Target BPM</span>
          <div class="stepper">
            <button class="stepper-btn" type="button" data-set="target" data-d="-1" aria-label="Lower target tempo">&minus;</button>
            <span class="stepper-value" id="targetValue">120</span>
            <button class="stepper-btn" type="button" data-set="target" data-d="1" aria-label="Raise target tempo">+</button>
          </div>
        </div>
        <div class="stepper-group">
          <span class="stepper-label">Step (BPM)</span>
          <div class="stepper">
            <button class="stepper-btn" type="button" data-set="step" data-d="-1" aria-label="Smaller steps">&minus;</button>
            <span class="stepper-value" id="stepValue">5</span>
            <button class="stepper-btn" type="button" data-set="step" data-d="1" aria-label="Bigger steps">+</button>
          </div>
        </div>
        <div class="stepper-group">
          <span class="stepper-label">Bars per step</span>
          <div class="stepper">
            <button class="stepper-btn" type="button" data-set="bars" data-d="-1" aria-label="Fewer bars per step">&minus;</button>
            <span class="stepper-value" id="barsValue">4</span>
            <button class="stepper-btn" type="button" data-set="bars" data-d="1" aria-label="More bars per step">+</button>
          </div>
        </div>
        <div class="stepper-group">
          <span class="stepper-label">Beats per bar</span>
          <div class="stepper">
            <button class="stepper-btn" type="button" data-set="beats" data-d="-1" aria-label="Fewer beats per bar">&minus;</button>
            <span class="stepper-value" id="beatsValue">4</span>
            <button class="stepper-btn" type="button" data-set="beats" data-d="1" aria-label="More beats per bar">+</button>
          </div>
        </div>
        <div class="stepper-group">
          <span class="stepper-label">Session</span>
          <span class="stepper-value" id="lengthValue">--</span>
        </div>
      </div>

      <div class="preset-row tempo-row" id="modeRow" role="group" aria-label="Route">
        <button class="preset-chip active" type="button" data-mode="up" aria-pressed="true">Up to target</button>
        <button class="preset-chip" type="button" data-mode="updown">Up and back down</button>
      </div>

      <button class="tap-pad" id="playBtn" type="button">&#9654; START</button>

      <p class="tool-hint">Press <kbd>Space</kbd> to start or stop. A one-bar count-in plays first. The gold rung on the ladder is the tempo you are on now.</p>
      <p class="embed-credit">
        <a href="https://metrognome.co.za/tools/speed-trainer.html?ref=embed" target="_blank" rel="noopener">Speed trainer</a>
        by <a href="https://metrognome.co.za/?ref=embed" target="_blank" rel="noopener">Metro Gnome</a>
      </p>
    </section>

  <script>
  (function () {
    /* ── the tempo ladder (port of SpeedTrainerConfig.stepsSequence, BPM
       steps; the trip down repeats the rungs in reverse) ──────────── */
    /* LADDER START */
    var MIN_BPM = 20, MAX_BPM = 300;
    function ladderFor(start, target, step, mode) {
      var steps = [], asc = start < target, cur = start;
      step = Math.max(1, step);
      while (true) {
        var b = Math.min(MAX_BPM, Math.max(MIN_BPM, Math.round(cur)));
        if (steps.length && (asc ? b <= steps[steps.length - 1] : b >= steps[steps.length - 1])) break;
        if (asc ? b >= target : b <= target) { steps.push(target); break; }
        steps.push(b);
        cur += asc ? step : -step;
      }
      if (!steps.length) steps.push(target);
      if (mode === 'updown' && steps.length > 1) {
        for (var i = steps.length - 2; i >= 0; i--) steps.push(steps[i]);
      }
      return steps;
    }
    function sessionSeconds(steps, bars, beats) {
      var s = 0;
      steps.forEach(function (b) { s += bars * beats * 60 / b; });
      return s + beats * 60 / steps[0];       /* the one-bar count-in */
    }
    /* LADDER END */

    var playBtn     = document.getElementById('playBtn');
    var bpmReadout  = document.getElementById('bpmReadout');
    var statusLabel = document.getElementById('statusLabel');
    var beatDots    = document.getElementById('beatDots');
    var progressBar = document.getElementById('progressBar');
    var ladderEl    = document.getElementById('ladder');
    var lengthValue = document.getElementById('lengthValue');
    var metroImg    = document.getElementById('metroImg');
    var setBtns     = Array.prototype.slice.call(document.querySelectorAll('#settings .stepper-btn'));
    var modeBtns    = Array.prototype.slice.call(document.querySelectorAll('#modeRow .preset-chip'));

    var LIMITS = { start: [20, 280], target: [20, 300], step: [1, 20], bars: [1, 16], beats: [1, 12] };
    var cfg = { start: 60, target: 120, step: 5, bars: 4, beats: 4, mode: 'up' };
    var VALUE_EL = {
      start: document.getElementById('startValue'), target: document.getElementById('targetValue'),
      step: document.getElementById('stepValue'), bars: document.getElementById('barsValue'),
      beats: document.getElementById('beatsValue')
    };

    var PREFS = 'metrognome.speedTrainer.v1';
    function loadPrefs() {
      try {
        var p = JSON.parse(window.localStorage.getItem(PREFS) || 'null');
        if (p) Object.keys(cfg).forEach(function (k) { if (p[k] !== undefined) cfg[k] = p[k]; });
      } catch (e) {}
    }
    function savePrefs() { try { window.localStorage.setItem(PREFS, JSON.stringify(cfg)); } catch (e) {} }

    /* deep links: ?start=60&target=120&step=5&bars=4&beats=4&mode=updown */
    function readQuery() {
      var q = window.location.search, found = false;
      ['start', 'target', 'step', 'bars', 'beats'].forEach(function (k) {
        var m = new RegExp('[?&]' + k + '=(\\d+)').exec(q);
        if (m) { cfg[k] = Number(m[1]); found = true; }
      });
      var md = /[?&]mode=(up|updown)\b/.exec(q);
      if (md) { cfg.mode = md[1]; found = true; }
      return found;
    }
    function clampCfg() {
      Object.keys(LIMITS).forEach(function (k) {
        cfg[k] = Math.min(LIMITS[k][1], Math.max(LIMITS[k][0], Math.round(Number(cfg[k]) || LIMITS[k][0])));
      });
      if (cfg.mode !== 'updown') cfg.mode = 'up';
    }

    var steps = [];
    function fmtLength(s) {
      var m = Math.floor(s / 60), r = Math.round(s - m * 60);
      if (r === 60) { m++; r = 0; }
      return m ? m + 'm ' + (r < 10 ? '0' : '') + r + 's' : r + 's';
    }
    function render() {
      Object.keys(VALUE_EL).forEach(function (k) { VALUE_EL[k].textContent = cfg[k]; });
      modeBtns.forEach(function (b) {
        var on = b.getAttribute('data-mode') === cfg.mode;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      steps = ladderFor(cfg.start, cfg.target, cfg.step, cfg.mode);
      lengthValue.textContent = fmtLength(sessionSeconds(steps, cfg.bars, cfg.beats));
      ladderEl.innerHTML = '';
      steps.forEach(function (b) {
        var r = document.createElement('span');
        r.className = 'st-rung';
        r.textContent = b;
        ladderEl.appendChild(r);
      });
      if (!playing) bpmReadout.textContent = steps[0];
      buildDots();
    }
    function buildDots() {
      beatDots.innerHTML = '';
      for (var i = 0; i < cfg.beats; i++) {
        var d = document.createElement('span');
        d.className = 'beat-dot';
        beatDots.appendChild(d);
      }
    }
    function lockSettings(locked) {
      setBtns.forEach(function (b) { b.disabled = locked; });
      modeBtns.forEach(function (b) { b.disabled = locked; });
    }

    setBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        if (playing) return;
        var k = b.getAttribute('data-set');
        cfg[k] += Number(b.getAttribute('data-d'));
        clampCfg();
        savePrefs();
        render();
      });
    });
    modeBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        if (playing) return;
        cfg.mode = b.getAttribute('data-mode');
        savePrefs();
        render();
      });
    });

    /* ── audio ───────────────────────────────────────────────────────── */
    var audioCtx = null, playing = false, schedulerTimer = null;
    var nextBeatTime = 0, stepIdx = 0, barInStep = 0, beatInBar = 0, countIn = true, startedAt = 0;
    var LOOKAHEAD_MS = 25, SCHEDULE_AHEAD_S = 0.12;

    function playClick(time, accent, soft) {
      var osc  = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = accent ? 1800 : 1100;
      var peak = (accent ? 0.4 : 0.32) * (soft ? 0.6 : 1);
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(peak, time + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.05);
    }
    function bump() {
      metroImg.classList.remove('bump');
      void metroImg.offsetWidth;
      metroImg.classList.add('bump');
      setTimeout(function () { metroImg.classList.remove('bump'); }, 90);
    }
    function at(t, fn) {
      var token = runToken;
      setTimeout(function () { if (playing && token === runToken) fn(); }, Math.max(0, (t - audioCtx.currentTime) * 1000));
    }
    var runToken = 0;

    function showBeat(stepI, bar, beat, isCount) {
      Array.prototype.forEach.call(beatDots.children, function (d, i) {
        d.className = 'beat-dot' + (i === beat ? (beat === 0 ? ' hit-great' : ' hit-ok') : '');
      });
      bump();
      if (isCount) {
        statusLabel.textContent = 'Count-in ' + (beat + 1) + ' of ' + cfg.beats;
        progressBar.style.width = '0%';
        return;
      }
      bpmReadout.textContent = steps[stepI];
      var down = cfg.mode === 'updown' && stepI >= Math.ceil(steps.length / 2) && steps.length > 1;
      statusLabel.textContent = 'Step ' + (stepI + 1) + ' of ' + steps.length + (down ? ', coming down' : '') + ' · bar ' + (bar + 1) + ' of ' + cfg.bars;
      progressBar.style.width = (100 * (bar * cfg.beats + beat + 1) / (cfg.bars * cfg.beats)).toFixed(1) + '%';
      Array.prototype.forEach.call(ladderEl.children, function (r, i) {
        r.className = 'st-rung' + (i === stepI ? ' now' : (i < stepI ? ' past' : ''));
      });
    }

    function scheduler() {
      while (nextBeatTime < audioCtx.currentTime + SCHEDULE_AHEAD_S) {
        var bpm = steps[stepIdx];
        var accent = beatInBar === 0;
        playClick(nextBeatTime, accent, countIn);
        (function (s, b, k, c) { at(nextBeatTime, function () { showBeat(s, b, k, c); }); })(stepIdx, barInStep, beatInBar, countIn);
        nextBeatTime += 60 / bpm;
        beatInBar++;
        if (beatInBar >= cfg.beats) {
          beatInBar = 0;
          if (countIn) countIn = false;
          else if (++barInStep >= cfg.bars) {
            barInStep = 0;
            if (++stepIdx >= steps.length) {
              clearInterval(schedulerTimer);
              schedulerTimer = null;
              at(nextBeatTime, function () { stop(true); });
              return;
            }
          }
        }
      }
    }

    function start() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.MetroAds) window.MetroAds.busy(true);
      render();
      playing = true;
      runToken++;
      lockSettings(true);
      stepIdx = 0; barInStep = 0; beatInBar = 0; countIn = true;
      startedAt = performance.now();
      playBtn.innerHTML = '&#9632; STOP';
      playBtn.classList.add('is-live');
      statusLabel.textContent = 'Count-in';
      nextBeatTime = audioCtx.currentTime + 0.2;
      schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
      scheduler();
    }

    function stop(completed) {
      if (!playing) return;
      playing = false;
      runToken++;
      clearInterval(schedulerTimer);
      schedulerTimer = null;
      if (window.MetroAds) window.MetroAds.busy(false);
      lockSettings(false);
      playBtn.innerHTML = '&#9654; START';
      playBtn.classList.remove('is-live');
      progressBar.style.width = '0%';
      Array.prototype.forEach.call(beatDots.children, function (d) { d.className = 'beat-dot'; });
      if (completed) {
        statusLabel.textContent = 'Done: ' + cfg.start + ' to ' + cfg.target + ' BPM' + (cfg.mode === 'updown' ? ' and back' : '') + ' in ' + fmtLength((performance.now() - startedAt) / 1000);
        Array.prototype.forEach.call(ladderEl.children, function (r) { r.className = 'st-rung past'; });
        metroImg.classList.remove('cheer');
        void metroImg.offsetWidth;
        metroImg.classList.add('cheer');
      } else {
        statusLabel.textContent = 'Stopped at ' + bpmReadout.textContent + ' BPM';
        bpmReadout.textContent = steps[0];
        Array.prototype.forEach.call(ladderEl.children, function (r) { r.className = 'st-rung'; });
      }
    }

    playBtn.addEventListener('click', function () { if (playing) stop(false); else start(); });
    window.addEventListener('keydown', function (e) {
      if (e.code !== 'Space' || e.repeat) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      if (playing) stop(false); else start();
    });

    loadPrefs();
    readQuery();
    clampCfg();
    render();
  })();
  </script>

</body>
</html>
