<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Widget build of https://metrognome.co.za/tools/steady-tempo-test.html. Generated by landing/embed/build-embeds.sh -

  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://metrognome.co.za/tools/steady-tempo-test.html">
  <link rel="icon" type="image/webp" href="/favicon.webp">

</head>
<body class="embed-body">

    <section class="tool-panel" aria-label="Interactive steady tempo test">
      <div class="metro-wrap">
        <img id="metroImg" src="/metro.png" alt="Metro the gnome, bobs on every beat">
      </div>

      <div class="bpm-readout" id="mainReadout">--</div>
      <div class="bpm-unit" id="mainUnit">steady score</div>
      <div class="marking" id="statusLabel">Ready when you are</div>
      <div class="best-line" id="bestLine" aria-live="polite"></div>

      <div class="phase-steps" id="phaseSteps" aria-hidden="true">
        <span class="phase-step">Listen</span><span class="phase-sep">&rsaquo;</span>
        <span class="phase-step">Tap along</span><span class="phase-sep">&rsaquo;</span>
        <span class="phase-step">On your own</span>
      </div>
      <p class="phase-tip" id="phaseTip" aria-live="polite"></p>

      <div class="beat-dots" id="beatDots" aria-hidden="true"></div>

      <div class="preset-row tempo-row" id="tempoRow" role="group" aria-label="Test tempo">
        <button class="preset-chip" type="button" data-bpm="60">60 BPM</button>
        <button class="preset-chip active" type="button" data-bpm="90" aria-pressed="true">90 BPM</button>
        <button class="preset-chip" type="button" data-bpm="120">120 BPM</button>
      </div>

      <button class="tap-pad" id="tapPad" type="button">START TEST</button>

      <div class="stat-row" id="statRow" hidden>
        <div class="stat">
          <span class="stat-value" id="heldValue">--</span>
          <span class="stat-label">Tempo you held</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="driftValue">--</span>
          <span class="stat-label">Start to finish</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="evenValue">--</span>
          <span class="stat-label">Tap to tap</span>
        </div>
      </div>

      <figure class="tap-strip" id="tempoStrip" hidden>
        <svg id="tempoSvg" viewBox="0 0 320 128" role="img" aria-label="The tempo of every beat you tapped after the click stopped"></svg>
        <figcaption>Each dot is the tempo of one silent beat, from the gap since your previous tap. The dashed line is the tempo you were given and the gold band is &plusmn;2% around it.</figcaption>
      </figure>

      <p class="verdict" id="verdict" hidden></p>

      <div class="tool-controls">
        <button class="btn-ghost" id="retryBtn" type="button" hidden>Try again</button>
      </div>

      <p class="tool-hint">Use <kbd>Space</kbd> or tap the button. Your device's audio delay does not affect the score.</p>
      <p class="embed-credit">
        <a href="https://metrognome.co.za/tools/steady-tempo-test.html?ref=embed" target="_blank" rel="noopener">Steady tempo test</a>
        by <a href="https://metrognome.co.za/?ref=embed" target="_blank" rel="noopener">Metro Gnome</a>
      </p>
    </section>

  <script>
  (function () {
    var tapPad      = document.getElementById('tapPad');
    var retryBtn    = document.getElementById('retryBtn');
    var mainReadout = document.getElementById('mainReadout');
    var mainUnit    = document.getElementById('mainUnit');
    var statusLabel = document.getElementById('statusLabel');
    var bestLine    = document.getElementById('bestLine');
    var beatDots    = document.getElementById('beatDots');
    var statRow     = document.getElementById('statRow');
    var heldValue   = document.getElementById('heldValue');
    var driftValue  = document.getElementById('driftValue');
    var evenValue   = document.getElementById('evenValue');
    var tempoStrip  = document.getElementById('tempoStrip');
    var tempoSvg    = document.getElementById('tempoSvg');
    var verdict     = document.getElementById('verdict');
    var metroImg    = document.getElementById('metroImg');
    var bandRows    = Array.prototype.slice.call(document.querySelectorAll('#bandTableBody tr'));
    var tempoBtns   = Array.prototype.slice.call(document.querySelectorAll('#tempoRow .preset-chip'));
    var phaseSteps  = Array.prototype.slice.call(document.querySelectorAll('#phaseSteps .phase-step'));
    var phaseTip    = document.getElementById('phaseTip');

    /* What is happening and what comes next, short enough to read at a
       glance during the count. Phase 0 is idle, before and after a run. */
    var TIPS = [
      'Listen for 4 beats, tap along for 8, then keep going when the click stops.',
      'Get ready: next, tap along with the click.',
      'Soon the click stops. Keep tapping at the same speed.',
      'Keep the same beat for 16 taps. The dots fill as you go.',
      'Done! Here is how steady you were.'
    ];
    function setPhase(n) {
      phaseSteps.forEach(function (el, i) {
        el.className = 'phase-step' + (i + 1 === n ? ' now' : (i + 1 < n ? ' past' : ''));
      });
      phaseTip.textContent = TIPS[n];
    }

    /* Score: half for holding the given tempo, half for even taps.
       A straight line is fitted through the tempo of every silent beat.
       "Hold" is how far that line sits from the given tempo on average, so
       it catches both a constant offset and a gradual drift; "even" is the
       scatter of the beats around the line, so a drift is not counted
       twice. Each part is full at or under its good bar and zero at or
       over its loose bar, scaling smoothly between, like the rhythm test. */
    var HOLD_GOOD  = 0.01,  HOLD_LOOSE = 0.06;    /* tempo error, fraction of the tempo */
    var EVEN_GOOD  = 0.015, EVEN_LOOSE = 0.07;    /* beat-to-beat scatter, fraction */
    var DRIFT_NOTE = 0.03;                        /* a start-to-finish change worth naming */

    var TEMPOS     = [60, 90, 120];
    var BPM        = 90;
    var LISTEN     = 4;
    var ALONG      = 8;
    var SILENT     = 16;
    var MIN_GAPS   = 6;
    var interval   = 60 / BPM;
    var lastTapAt  = -Infinity;

    var audioCtx = null;
    var state = 'idle';                     /* idle | running | done */
    var taps = [];                          /* every accepted tap, performance.now() ms */
    var silenceAt = Infinity;               /* perf ms from which a tap counts as silent */
    var silentTaps = 0;
    var schedulerTimer = null, idleTimer = null;
    var nextBeatTime = 0, beatIndex = 0, ctxToPerf = 0;

    var LOOKAHEAD_MS = 25;
    var SCHEDULE_AHEAD_S = 0.12;

    function buildDots() {
      beatDots.innerHTML = '';
      for (var i = 0; i < SILENT; i++) {
        var d = document.createElement('span');
        d.className = 'beat-dot';
        beatDots.appendChild(d);
      }
    }
    buildDots();

    /* ── tempo ────────────────────────────────────────────────────────── */
    function setTempo(bpm) {
      if (state === 'running' || TEMPOS.indexOf(bpm) < 0) return;
      BPM = bpm;
      interval = 60 / BPM;
      tempoBtns.forEach(function (b) {
        var on = Number(b.getAttribute('data-bpm')) === BPM;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      showBest(false);
    }
    function lockTempo(locked) { tempoBtns.forEach(function (b) { b.disabled = locked; }); }
    tempoBtns.forEach(function (b) {
      b.addEventListener('click', function () { setTempo(Number(b.getAttribute('data-bpm'))); });
    });

    /* ── best score, per tempo, in this browser only ──────────────────── */
    function bestKey() { return 'metrognome.steadyTest.best.' + BPM; }
    function readBest() {
      try { var v = Number(window.localStorage.getItem(bestKey())); return v > 0 ? v : null; }
      catch (e) { return null; }
    }
    function saveBest(s) { try { window.localStorage.setItem(bestKey(), String(s)); } catch (e) {} }
    function showBest(isNew) {
      var best = readBest();
      bestLine.classList.toggle('is-new', isNew);
      if (isNew) bestLine.textContent = 'New best at ' + BPM + ' BPM';
      else if (best !== null) bestLine.textContent = 'Your best at ' + BPM + ' BPM: ' + best;
      else bestLine.textContent = '';
    }

    /* ── audio clock <-> performance clock (as in the rhythm test) ────── */
    function syncClocks() {
      var perfNow = performance.now();
      var ctxNow  = audioCtx.currentTime;
      if (typeof audioCtx.getOutputTimestamp === 'function') {
        var ts = audioCtx.getOutputTimestamp();
        if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
          ctxToPerf = ts.performanceTime - ts.contextTime * 1000;
          return;
        }
      }
      var lat = (typeof audioCtx.outputLatency === 'number' && isFinite(audioCtx.outputLatency))
        ? audioCtx.outputLatency : 0;
      ctxToPerf = perfNow - ctxNow * 1000 + lat * 1000;
    }
    function ctxTimeToPerf(t) { return t * 1000 + ctxToPerf; }

    function playClick(time, accent) {
      var osc  = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = accent ? 1800 : 1100;
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.4 : 0.32, time + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.05);
      setTimeout(bump, Math.max(0, (time - audioCtx.currentTime) * 1000));
    }

    function bump() {
      metroImg.classList.remove('bump');
      void metroImg.offsetWidth;
      metroImg.classList.add('bump');
      setTimeout(function () { metroImg.classList.remove('bump'); }, 90);
    }

    function later(t, fn) {
      setTimeout(function () { if (state === 'running') fn(); }, Math.max(0, (t - audioCtx.currentTime) * 1000));
    }

    /* ── scheduler: LISTEN + ALONG clicks, then silence ───────────────── */
    function scheduler() {
      while (nextBeatTime < audioCtx.currentTime + SCHEDULE_AHEAD_S) {
        if (beatIndex >= LISTEN + ALONG) {
          clearInterval(schedulerTimer);
          schedulerTimer = null;
          /* the first silent beat is where the next click would have been;
             a tap counts as silent from half a beat before it */
          silenceAt = ctxTimeToPerf(nextBeatTime) - interval * 500;
          later(nextBeatTime - interval * 0.5, function () { statusLabel.textContent = 'Keep going on your own'; setPhase(3); });
          return;
        }
        playClick(nextBeatTime, beatIndex % 4 === 0);
        if (beatIndex < LISTEN) {
          (function (n) { later(nextBeatTime, function () { statusLabel.textContent = 'Listen... ' + n; }); })(LISTEN - beatIndex);
        } else if (beatIndex === LISTEN) {
          later(nextBeatTime, function () { statusLabel.textContent = 'Tap along'; setPhase(2); });
        } else if (beatIndex >= LISTEN + ALONG - 2) {
          /* the last two clicks count down to the silence */
          (function (n) { later(nextBeatTime, function () { statusLabel.textContent = 'Click stops in ' + n; }); })(LISTEN + ALONG - beatIndex);
        }
        beatIndex++;
        nextBeatTime += interval;
      }
    }

    /* ── run control ──────────────────────────────────────────────────── */
    function start() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.MetroAds) window.MetroAds.busy(true);

      state = 'running';
      lockTempo(true);
      showBest(false);
      taps = [];
      silentTaps = 0;
      silenceAt = Infinity;
      beatIndex = 0;
      buildDots();
      statRow.hidden = true;
      tempoStrip.hidden = true;
      verdict.hidden = true;
      retryBtn.hidden = true;
      bandRows.forEach(function (r) { r.classList.remove('current-row'); });
      mainReadout.textContent = '--';
      mainUnit.textContent = 'steady score';
      tapPad.textContent = 'TAP';
      tapPad.classList.add('is-live');
      statusLabel.textContent = 'Listen...';
      setPhase(1);

      syncClocks();
      nextBeatTime = audioCtx.currentTime + 0.35;
      schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
      scheduler();
      setTimeout(function () { if (state === 'running') syncClocks(); }, 400);
      armIdle();
    }

    /* A run that stops getting taps ends itself: three silent beats with
       nothing tapped after the click has gone quiet is the player done. */
    function armIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        if (state !== 'running') return;
        if (performance.now() > silenceAt) finish();
        else armIdle();
      }, (LISTEN + ALONG) * interval * 1000 + 3 * interval * 1000);
    }

    function pressTime(e) {
      var now = performance.now();
      var t = e && typeof e.timeStamp === 'number' ? e.timeStamp : NaN;
      return (t > 0 && t <= now && now - t < 1000) ? t : now;
    }

    function registerTap(t) {
      if (state !== 'running') return;
      lastTapAt = t;
      /* a bounce or double tap far inside a beat is not a beat */
      if (taps.length && t - taps[taps.length - 1] < interval * 500) return;
      taps.push(t);
      bump();
      if (t >= silenceAt) {
        var d = beatDots.children[silentTaps];
        if (d) d.className = 'beat-dot hit-great';
        silentTaps++;
        mainReadout.textContent = String(silentTaps);
        mainUnit.textContent = 'of ' + SILENT + ' on your own';
        if (silentTaps >= SILENT) { setTimeout(finish, 150); return; }
      }
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        if (state === 'running' && performance.now() > silenceAt) finish();
      }, Math.max(3 * interval * 1000, silenceAt - performance.now() + 3 * interval * 1000));
    }

    /* ── scoring ──────────────────────────────────────────────────────── */
    function median(xs) {
      var s = xs.slice().sort(function (a, b) { return a - b; });
      var m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }
    function clamp01(v) { return Math.min(1, Math.max(0, v)); }

    /* least-squares straight line through ys at x = 0, 1, 2 ... */
    function lineFit(ys) {
      var n = ys.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (var i = 0; i < n; i++) { sx += i; sy += ys[i]; sxx += i * i; sxy += i * ys[i]; }
      var den = n * sxx - sx * sx;
      var slope = den ? (n * sxy - sx * sy) / den : 0;
      var icpt = (sy - slope * sx) / n;
      return { at: function (x) { return icpt + slope * x; } };
    }

    function finish() {
      if (state !== 'running') return;
      state = 'done';
      clearInterval(schedulerTimer);
      clearTimeout(idleTimer);
      if (window.MetroAds) window.MetroAds.busy(false);
      lockTempo(false);
      restKey(tapPad);

      /* Gaps that end on a silent tap. The first one bridges from the last
         tap along with the click into the silence, which is exactly the
         moment the inner clock takes over. */
      var gaps = [];
      for (var i = 1; i < taps.length; i++) {
        if (taps[i] >= silenceAt) gaps.push(taps[i] - taps[i - 1]);
      }
      /* a skipped beat shows as a double-length gap; it is not a tempo */
      var target = interval * 1000;
      gaps = gaps.filter(function (g) { return g < target * 1.6; });

      if (gaps.length < MIN_GAPS) {
        mainReadout.textContent = '--';
        mainUnit.textContent = 'not enough taps';
        statusLabel.textContent = 'Give it another go';
        setPhase(0);
        statRow.hidden = true;
        verdict.hidden = false;
        verdict.textContent = 'The test needs at least ' + MIN_GAPS + ' taps after the click stops. Start again, and when the click goes quiet, keep tapping as if it were still there.';
        return;
      }

      /* tempo of each silent beat, as a fraction of the given tempo */
      var rel = gaps.map(function (g) { return target / g; });
      var fit = lineFit(rel);
      var n = rel.length;
      var holdErr = 0;
      for (var k = 0; k < n; k++) holdErr += Math.abs(fit.at(k) - 1);
      holdErr /= n;
      var resid = rel.map(function (v, k) { return v - fit.at(k); });
      var mad = median(resid.map(function (v) { return Math.abs(v - median(resid)); }));
      var wobble = 1.4826 * mad;
      var held = BPM * median(rel);
      var drift = fit.at(n - 1) - fit.at(0);       /* start-to-finish change, fraction */

      var fHold = clamp01((HOLD_LOOSE - holdErr) / (HOLD_LOOSE - HOLD_GOOD));
      var fEven = clamp01((EVEN_LOOSE - wobble) / (EVEN_LOOSE - EVEN_GOOD));
      var score = Math.round(100 * (0.5 * fHold + 0.5 * fEven));

      mainReadout.textContent = score;
      mainUnit.textContent = 'steady score';
      statusLabel.textContent = bandName(score);
      statRow.hidden = false;
      heldValue.textContent = Math.round(held) + ' BPM';
      var driftBpm = Math.round(drift * BPM);
      driftValue.textContent = (driftBpm > 0 ? '+' : '') + driftBpm + ' BPM';
      evenValue.textContent = '±' + (wobble * 100).toFixed(1) + '%';

      bandRows.forEach(function (r) {
        var lo = Number(r.getAttribute('data-min'));
        var hi = Number(r.getAttribute('data-max'));
        r.classList.toggle('current-row', score >= lo && score <= hi);
      });

      var prevBest = readBest();
      if (prevBest === null || score > prevBest) saveBest(score);
      showBest(prevBest !== null && score > prevBest);

      drawTempo(gaps);
      verdict.hidden = false;
      verdict.textContent = readOut(score, held, drift, wobble);
      setPhase(4);
      reveal(score, 0, Math.round);
    }

    function bandName(s) {
      if (s >= 85) return 'Rock steady';
      if (s >= 65) return 'Steady';
      if (s >= 40) return 'Finding it';
      return 'Warming up';
    }

    function readOut(score, held, drift, wobble) {
      var r = Math.round(held), s;
      if (score >= 85) s = 'Rock steady. With the click gone you held ' + r + ' BPM against ' + BPM + ', and your taps stayed even.';
      else if (score >= 65) s = 'Steady. You carried the tempo on your own at about ' + r + ' BPM against ' + BPM + '.';
      else if (score >= 40) s = 'Finding it. Your pulse carried you through the silence at about ' + r + ' BPM against ' + BPM + '. Counting the space between beats is the next step.';
      else s = 'Warming up. You kept going on your own, which is the hard part. Counting "one and two and" through the silence usually lifts this score quickly.';
      if (Math.abs(drift) >= DRIFT_NOTE) {
        s += ' You ' + (drift > 0 ? 'eased faster' : 'eased slower') + ' as the silence went on, by about ' + Math.abs(Math.round(drift * BPM)) + ' BPM.';
      }
      if (score >= 65 && BPM !== 60) s += ' Now try 60 BPM, where the longer gaps make holding a tempo much harder.';
      return s;
    }

    /* ── chart: tempo of each silent gap against the given tempo ──────── */
    var SVG_NS = 'http://www.w3.org/2000/svg';
    function el(name, attrs, text) {
      var n = document.createElementNS(SVG_NS, name);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text) n.textContent = text;
      return n;
    }
    function drawTempo(gaps) {
      var W = 320, LEFT = 56, RIGHT = 50, MID = 64, HALF = 55;
      var RANGE = 0.12;                     /* +-12% fills the height; beyond is pinned */
      function y(bpm) {
        var f = Math.max(-RANGE, Math.min(RANGE, bpm / BPM - 1));
        return MID - f / RANGE * HALF;
      }
      function x(i) { return LEFT + (W - LEFT - RIGHT) * (i + 0.5) / Math.max(gaps.length, SILENT); }

      while (tempoSvg.firstChild) tempoSvg.removeChild(tempoSvg.firstChild);
      tempoSvg.appendChild(el('rect', { 'class': 'ts-band', x: LEFT - 4, y: y(BPM * 1.02),
        width: W - LEFT - RIGHT + 8, height: y(BPM * 0.98) - y(BPM * 1.02), rx: 4 }));
      [1.1, 0.9].forEach(function (f) {
        tempoSvg.appendChild(el('line', { 'class': 'ts-grid', x1: LEFT - 4, x2: W - RIGHT + 4, y1: y(BPM * f), y2: y(BPM * f) }));
        tempoSvg.appendChild(el('text', { 'class': 'ts-label', x: W - RIGHT + 8, y: y(BPM * f) + 4 }, (f > 1 ? '+' : '-') + '10%'));
      });
      tempoSvg.appendChild(el('line', { 'class': 'ts-centre', x1: LEFT - 4, x2: W - RIGHT + 4, y1: MID, y2: MID }));
      tempoSvg.appendChild(el('text', { 'class': 'ts-label', x: 2, y: y(BPM * 1.1) + 3.5 }, 'Faster'));
      tempoSvg.appendChild(el('text', { 'class': 'ts-label ts-strong', x: 2, y: MID + 3.5 }, BPM + ''));
      tempoSvg.appendChild(el('text', { 'class': 'ts-label', x: 2, y: y(BPM * 0.9) + 3.5 }, 'Slower'));

      var bpms = gaps.map(function (g) { return 60000 / g; });
      var pts = bpms.map(function (b, i) { return x(i).toFixed(1) + ',' + y(b).toFixed(1); });
      if (pts.length > 1) tempoSvg.appendChild(el('polyline', { 'class': 'ts-path', points: pts.join(' ') }));
      bpms.forEach(function (b, i) {
        var dot = el('circle', { 'class': 'ts-tap' + (Math.abs(b / BPM - 1) <= 0.02 ? ' tight' : ''), cx: x(i), cy: y(b), r: 4.6 });
        dot.style.animationDelay = (i * 35) + 'ms';
        dot.appendChild(el('title', {}, 'Beat ' + (i + 1) + ': ' + Math.round(b) + ' BPM'));
        tempoSvg.appendChild(dot);
      });
      tempoStrip.hidden = false;
    }


    /* ── finish moment, the same in every test: the start key rests as
       DONE for a moment so a last tap cannot start a run on top of the
       result, then the score counts into place, Metro cheers, and the
       page brings the score into view if it has scrolled away. ──────── */
    var REST_MS = 1600;
    var restUntil = 0;
    function restKey(pad) {
      restUntil = performance.now() + REST_MS;
      pad.classList.remove('is-live');
      pad.classList.add('is-done');
      pad.disabled = true;
      pad.textContent = 'DONE';
      setTimeout(function () {
        pad.classList.remove('is-done');
        pad.disabled = false;
        pad.textContent = 'START AGAIN';
      }, REST_MS);
    }
    function reveal(to, from, fmt) {
      var raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window)
                                             : function (f) { setTimeout(f, 16); };
      mainReadout.classList.remove('reveal');
      metroImg.classList.remove('cheer');
      void mainReadout.offsetWidth;
      mainReadout.classList.add('reveal');
      metroImg.classList.add('cheer');
      var t0 = performance.now(), DUR = 750;
      (function step() {
        var k = Math.min(1, (performance.now() - t0) / DUR);
        var e = 1 - Math.pow(1 - k, 3);
        mainReadout.textContent = fmt(from + (to - from) * e);
        if (k < 1) raf(step);
      })();
      if (mainReadout.getBoundingClientRect && window.scrollBy) {
        var top = mainReadout.getBoundingClientRect().top;
        if (top < 60 || top > window.innerHeight * 0.45) {
          window.scrollBy({ top: top - 140, behavior: 'smooth' });
        }
      }
    }
    /* ── input: taps on press, start on click (as in the rhythm test) ─── */
    tapPad.addEventListener('pointerdown', function (e) {
      if (state !== 'running') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      registerTap(pressTime(e));
    });
    function mayStart() { return state !== 'running' && performance.now() - lastTapAt >= 800 && performance.now() >= restUntil; }
    tapPad.addEventListener('click', function () { if (mayStart()) start(); });
    retryBtn.addEventListener('click', start);

    window.addEventListener('keydown', function (e) {
      if (e.code !== 'Space' || e.repeat) return;
      e.preventDefault();
      tapPad.classList.add('pressed');
      if (state === 'running') registerTap(pressTime(e));
      else if (mayStart()) start();
    });
    window.addEventListener('keyup', function (e) {
      if (e.code === 'Space') tapPad.classList.remove('pressed');
    });

    setPhase(0);
    var bpmParam = /[?&]bpm=(\d+)/.exec(window.location.search);
    setTempo(bpmParam ? Number(bpmParam[1]) : BPM);
  })();
  </script>

</body>
</html>
